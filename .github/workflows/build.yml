name: Build WSA

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'WSA Channel (retail, release preview, insider slow, insider fast)'
        required: true
        default: 'retail'
      magisk_version:
        description: 'Magisk Version (stable, beta, canary, debug)'
        required: true
        default: 'stable'
      gapps:
        description: 'Include GApps? (true/false)'
        required: true
        default: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build WSA
        run: |
          .\scripts\run.ps1 -Channel ${{ github.event.inputs.channel }} -MagiskVersion ${{ github.event.inputs.magisk_version }} -GApps ${{ github.event.inputs.gapps }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WSA-Build
          path: .\output\*
